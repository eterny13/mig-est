version: 2

project_name: mig-est

before:
  hooks:
    - go mod tidy

builds:
  - id: mig-est
    main: ./cmd/mig-est
    binary: mig-est
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/eterny13/mig-est/internal/version.Version={{ .Version }}
      - -X github.com/eterny13/mig-est/internal/version.Commit={{ .Commit }}
      - -X github.com/eterny13/mig-est/internal/version.Date={{ .Date }}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
